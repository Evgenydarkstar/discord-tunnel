[package]
name = "discord-runtime"
version = "0.1.0"
edition = "2021"
description = "Cross-platform network runtime: HTTP/3 QUIC sessions with crash containment (epoch/restart, bounded queue, FFI)."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
bytes = "1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
quinn = { version = "0.11.7", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "net"] }
# Keep the embedded loopback bridge on std sockets; Tokio is used by the HTTP/3 transport.
