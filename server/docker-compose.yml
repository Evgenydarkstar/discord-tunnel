services:
  discord-tunnel:
    build:
      context: .
      dockerfile: Dockerfile.discord
    container_name: discord-tunnel
    restart: unless-stopped
    entrypoint: ["/app/scripts/start-discord-http3.sh"]
    ports:
      - "${VPN_PORT:-443}:${VPN_PORT:-443}/udp"
    env_file:
      - .env
    environment:
      DISCORD_HTTP3_HOST: "0.0.0.0"
      DISCORD_HTTP3_PORT: "${VPN_PORT:-443}"
      DISCORD_HTTP3_TOKEN: "${DISCORD_HTTP3_TOKEN:-}"
      DISCORD_HTTP3_ALLOWED_HOSTS: "${DISCORD_HTTP3_ALLOWED_HOSTS:-discord.com,discord.gg,discord.media,discordapp.com,discordapp.net,discord-attachments-uploads-prd.storage.googleapis.com}"
      DISCORD_HTTP3_CERT_PATH: "/data/run/discord-http3/tls.crt"
      DISCORD_HTTP3_KEY_PATH: "/data/run/discord-http3/tls.key"
    volumes:
      - ./data:/data
